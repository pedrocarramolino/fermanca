name: Disparar recordatorios

# Alternativa gratuita a Vercel Cron (que en el plan Hobby limita la
# frecuencia de los cron jobs). GitHub Actions permite "* * * * *" pero solo
# lo cumple a partir de cada 5 minutos como mínimo realista, y de forma
# "best effort" (puede retrasarse en horas de mucha carga) — la ventana de
# tolerancia del endpoint (ver isReminderPending) está pensada justo para
# esto. Requiere el secreto CRON_SECRET_HEADER configurado en
# Settings → Secrets and variables → Actions de este repositorio, con el
# mismo valor que CRON_SECRET en Vercel.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de recordatorios
        run: |
          curl -sf -X GET "${{ vars.APP_URL }}/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET_HEADER }}"
