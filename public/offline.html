<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · PracticeFlow</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #71717a;
        --primary: #1a7a6e;
        --primary-fg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171717;
          --fg: #fafafa;
          --muted: #a3a3a3;
          --primary: #5ecdb9;
          --primary-fg: #0a2622;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      svg {
        color: var(--muted);
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0;
      }
      p {
        color: var(--muted);
        font-size: 0.875rem;
        max-width: 28rem;
        margin: 0;
      }
      button {
        margin-top: 0.5rem;
        border: none;
        border-radius: 0.625rem;
        background: var(--primary);
        color: var(--primary-fg);
        font-size: 0.875rem;
        font-weight: 500;
        padding: 0.5rem 1.25rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <svg
      width="40"
      height="40"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <line x1="1" y1="1" x2="23" y2="23"></line>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
      <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      <line x1="12" y1="20" x2="12.01" y2="20"></line>
    </svg>
    <h1>Sin conexión</h1>
    <p>
      No se puede cargar esta página sin conexión. Las páginas que ya hayas visitado antes siguen
      disponibles.
    </p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </body>
</html>
